<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1230" viewBox="0 0 1600 1230" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
  <title>刷题通：本地版与部署版系统架构</title>
  <desc>两份页面分别提供浏览器文档解析、预览纠错与练习考试。本地版使用 localStorage；部署版通过 Flask API、内存 Token 和每用户 JSON 目录保存数据。Docker Compose 挂载页面与数据目录。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#8CA1AF" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="1230" rx="0" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="1.5" />
  <rect x="64" y="54" width="7" height="105" rx="2" fill="#315ED4" stroke="#315ED4" stroke-width="1.5" />
  <text x="94" y="76" fill="#315ED4" font-size="18" font-weight="700">SHUATI / TWO MODES, ONE STUDY WORKFLOW</text>
  <text x="89" y="145" fill="#172B3A" font-size="62" font-weight="700">刷题通</text>
  <text x="325" y="141" fill="#5A6F7C" font-size="31" font-weight="400">从文档到题库，从练习到复习</text>
  <text x="94" y="187" fill="#5A6F7C" font-size="24" font-weight="400">原生 JavaScript 页面  ·  Flask 服务  ·  无数据库  ·  无前端打包</text>
  <rect x="64" y="232" width="700" height="140" rx="18" fill="#FFFFFF" stroke="#D4E0E7" stroke-width="1.5" />
  <text x="90" y="267" fill="#315ED4" font-size="17" font-weight="700">BROWSER / IMPORT</text>
  <text x="90" y="309" fill="#172B3A" font-size="29" font-weight="700">文档解析与题目标准化</text>
  <text x="90" y="345" fill="#5A6F7C" font-size="22" font-weight="400">DOCX · XLSX / XLS · TXT · 文本型 PDF</text>
  <rect x="836" y="232" width="700" height="140" rx="18" fill="#FFFFFF" stroke="#D4E0E7" stroke-width="1.5" />
  <text x="862" y="267" fill="#315ED4" font-size="17" font-weight="700">BROWSER / REVIEW</text>
  <text x="862" y="309" fill="#172B3A" font-size="29" font-weight="700">预览纠错 → 练习 / 模拟考试</text>
  <text x="862" y="345" fill="#5A6F7C" font-size="22" font-weight="400">五种题型 · 重复检查 · 错题重练 · 答题卡</text>
  <path d="M 764 302 H 836" fill="none" stroke="#8CA1AF" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round" />
  <text x="64" y="412" fill="#5A6F7C" font-size="21" font-weight="400">下方两份页面分别实现上述能力；它们使用不同的数据存储入口。</text>
  <rect x="64" y="452" width="700" height="636" rx="24" fill="#EDF2FF" stroke="#C7D6F7" stroke-width="1.5" />
  <rect x="836" y="452" width="700" height="636" rx="24" fill="#EAF6F2" stroke="#BEDFD3" stroke-width="1.5" />
  <text x="94" y="498" fill="#315ED4" font-size="24" font-weight="700">MODE A  /  本地使用</text>
  <text x="866" y="498" fill="#087C6F" font-size="24" font-weight="700">MODE B  /  服务端部署</text>
  <rect x="94" y="536" width="640" height="140" rx="18" fill="#FFFFFF" stroke="#D4E0E7" stroke-width="1.5" />
  <text x="120" y="571" fill="#315ED4" font-size="17" font-weight="700">ENTRY / NO LOGIN</text>
  <text x="120" y="613" fill="#172B3A" font-size="29" font-weight="700">index.html</text>
  <text x="120" y="649" fill="#5A6F7C" font-size="22" font-weight="400">直接打开浏览器页面，无需后端服务</text>
  <rect x="866" y="536" width="640" height="140" rx="18" fill="#FFFFFF" stroke="#D4E0E7" stroke-width="1.5" />
  <text x="892" y="571" fill="#087C6F" font-size="17" font-weight="700">ENTRY / ACCOUNT LOGIN</text>
  <text x="892" y="613" fill="#172B3A" font-size="29" font-weight="700">static/index.html</text>
  <text x="892" y="649" fill="#5A6F7C" font-size="22" font-weight="400">Flask 提供页面，fetch 调用同源 /api</text>
  <path d="M 414 676 V 782" fill="none" stroke="#8CA1AF" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round" />
  <text x="436" y="740" fill="#5A6F7C" font-size="20" font-weight="400">浏览器读写</text>
  <path d="M 1186 676 V 730" fill="none" stroke="#8CA1AF" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round" />
  <rect x="94" y="782" width="640" height="166" rx="18" fill="#FFFFFF" stroke="#D4E0E7" stroke-width="1.5" />
  <text x="120" y="817" fill="#315ED4" font-size="17" font-weight="700">PERSISTENCE / DEVICE LOCAL</text>
  <text x="120" y="859" fill="#172B3A" font-size="29" font-weight="700">localStorage</text>
  <text x="120" y="895" fill="#5A6F7C" font-size="22" font-weight="400">题库 · 题目 · 答题记录 · 普通练习进度</text>
  <text x="120" y="925" fill="#5A6F7C" font-size="21" font-weight="400">存储在当前浏览器及当前来源</text>
  <rect x="866" y="730" width="640" height="140" rx="18" fill="#153D3A" stroke="#153D3A" stroke-width="1.5" />
  <text x="892" y="765" fill="#A9DAD0" font-size="17" font-weight="700">API / PYTHON + FLASK</text>
  <text x="892" y="807" fill="#FFFFFF" font-size="29" font-weight="700">认证 · 用户管理 · 题库与进度</text>
  <text x="892" y="843" fill="#D0E7E0" font-size="22" font-weight="400">Bearer Token · 管理员 / 普通用户</text>
  <path d="M 1186 870 V 900 H 1080 M 1186 900 H 1395" stroke="#8CA1AF" stroke-width="2.5" fill="none" />
  <path d="M 1080 900 V 924" fill="none" stroke="#8CA1AF" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round" />
  <path d="M 1395 900 V 924" fill="none" stroke="#8CA1AF" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round" stroke-dasharray="7 6" />
  <rect x="866" y="924" width="428" height="132" rx="18" fill="#FFFFFF" stroke="#D4E0E7" stroke-width="1.5" />
  <text x="890" y="959" fill="#087C6F" font-size="16" font-weight="700">PERSISTENCE / SERVER</text>
  <text x="890" y="1000" fill="#172B3A" font-size="28" font-weight="700">每用户 JSON 目录</text>
  <text x="890" y="1034" fill="#5A6F7C" font-size="21" font-weight="400">账号 · 题库 · 记录 · 练习进度</text>
  <rect x="1318" y="924" width="188" height="132" rx="18" fill="#FFFFFF" stroke="#D4E0E7" stroke-width="1.5" />
  <text x="1340" y="959" fill="#087C6F" font-size="16" font-weight="700">SESSION</text>
  <text x="1340" y="1000" fill="#172B3A" font-size="24" font-weight="700">内存 Token</text>
  <text x="1340" y="1034" fill="#5A6F7C" font-size="19" font-weight="400">服务重启失效</text>
  <text x="94" y="1007" fill="#315ED4" font-size="24" font-weight="700">题库数据不自动跨设备同步</text>
  <text x="94" y="1048" fill="#5A6F7C" font-size="21" font-weight="400">与部署版存储相互独立，没有自动迁移</text>
  <path d="M 64 1130 H 1536" stroke="#D4E0E7" stroke-width="1.5" />
  <text x="64" y="1174" fill="#087C6F" font-size="17" font-weight="700">DEPLOYMENT</text>
  <text x="278" y="1174" fill="#172B3A" font-size="25" font-weight="700">Docker Compose  :4000</text>
  <text x="780" y="1174" fill="#5A6F7C" font-size="23" font-weight="400">./static → /app/static</text>
  <text x="1230" y="1174" fill="#5A6F7C" font-size="23" font-weight="400">./data → /data</text>
  <text x="64" y="1211" fill="#5A6F7C" font-size="19" font-weight="400">JSON 存储适合受控单实例使用；所有解析与判题逻辑在浏览器运行。</text>
</svg>